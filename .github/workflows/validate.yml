name: Validar projeto

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      - name: Conferir formatação Terraform
        run: terraform fmt -check -recursive

      - name: Validar infraestrutura
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate -no-color

      - name: Validar bucket de state
        working-directory: bootstrap
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate -no-color

      - name: Construir imagem Docker
        run: docker build -t terraform-aws-nginx:ci ./app

      - name: Testar resposta HTTP
        run: |
          docker run -d --name nginx-check -p 8080:80 terraform-aws-nginx:ci
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:8080/health | grep -qx ok; then
              exit 0
            fi
            sleep 2
          done
          docker logs nginx-check
          exit 1
